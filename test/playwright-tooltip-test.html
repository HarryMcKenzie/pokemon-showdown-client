<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Tooltip Playwright Test</title>
</head>
<body>
  <pre id="results"></pre>
  <script>
    window.exports = window;
    window.BattlePokedex = window.BattlePokedex || {};
  </script>
  <script src="../play.pokemonshowdown.com/js/battle-dex-data.js"></script>
  <script src="../play.pokemonshowdown.com/js/battle-dex.js"></script>
  <script src="../play.pokemonshowdown.com/js/battle-scene-stub.js"></script>
  <script src="../play.pokemonshowdown.com/js/battle-text-parser.js"></script>
  <script src="../play.pokemonshowdown.com/js/battle.js"></script>
  <script src="../play.pokemonshowdown.com/js/battle-tooltips.js"></script>
  <script>
    const SNORLAX_SERVER = {
      stats: {atk: 256, def: 166, spa: 166, spd: 256, spe: 96},
      ability: 'Thick Fat',
      baseAbility: 'Thick Fat',
      item: 'Leftovers',
      speciesForme: 'Snorlax',
      hp: 524,
      maxhp: 524,
    };

    function createBattle(extraLog) {
      return new Battle({
        debug: true,
        log: [
          '|init|battle',
          '|title|Test vs. Test',
          '|player|p1|Test|1',
          '|player|p2|Test2|2',
          '|teamsize|p1|6',
          '|teamsize|p2|6',
          '|gametype|singles',
          '|gen|9',
          '|tier|[Gen 9] Shared Power (No Restrictions)',
          '|',
          '|start',
          ...extraLog,
        ],
      });
    }

    const results = [];

    function runTest(name, fn) {
      try {
        fn();
        results.push({name, passed: true});
      } catch (e) {
        results.push({name, passed: false, error: e.message});
      }
    }

    function assertEqual(actual, expected, msg) {
      if (actual !== expected) {
        throw new Error(`${msg}: expected ${expected}, got ${actual}`);
      }
    }

    // --- Tests ---

    runTest('Huge Power shared should double Atk', () => {
      const battle = createBattle([
        '|switch|p1a: Azumarill|Azumarill, F|100/100',
        '|switch|p2a: Blissey|Blissey, F|100/100',
        '|turn|1', '|',
        '|switch|p1a: Snorlax|Snorlax, M|100/100',
        '|-start|p1a: Snorlax|ability: Huge Power',
        '|turn|2',
      ]);
      const snorlax = battle.sides[0].active[0];
      if (!snorlax.volatiles['hugepower']) throw new Error('Missing hugepower volatile');
      const tooltips = new BattleTooltips(battle);
      const stats = tooltips.calculateModifiedStats(snorlax, SNORLAX_SERVER);
      assertEqual(stats.atk, 512, 'Shared Huge Power Atk');
    });

    runTest('Pure Power shared should double Atk', () => {
      const battle = createBattle([
        '|switch|p1a: Medicham|Medicham, F|100/100',
        '|switch|p2a: Blissey|Blissey, F|100/100',
        '|turn|1', '|',
        '|switch|p1a: Snorlax|Snorlax, M|100/100',
        '|-start|p1a: Snorlax|ability: Pure Power',
        '|turn|2',
      ]);
      const snorlax = battle.sides[0].active[0];
      const tooltips = new BattleTooltips(battle);
      const stats = tooltips.calculateModifiedStats(snorlax, SNORLAX_SERVER);
      assertEqual(stats.atk, 512, 'Shared Pure Power Atk');
    });

    runTest('Hustle shared should multiply Atk by 1.5', () => {
      const battle = createBattle([
        '|switch|p1a: Delibird|Delibird, M|100/100',
        '|switch|p2a: Blissey|Blissey, F|100/100',
        '|turn|1', '|',
        '|switch|p1a: Snorlax|Snorlax, M|100/100',
        '|-start|p1a: Snorlax|ability: Hustle',
        '|turn|2',

      const snorlax = battle.sides[0].active[0];
      const tooltips = new BattleTooltips(battle);
      const stats = tooltips.calculateModifiedStats(snorlax, SNORLAX_SERVER);
      assertEqual(stats.atk, 384, 'Shared Hustle Atk');
    });

      const stats = tooltips.calculateModifiedStats(snorlax, SNORLAX_SERVER);
      assertEqual(stats.def, 332, 'Shared Fur Coat Def');
    });

    runTest('Quick Feet shared should boost Spe and ignore paralysis', () => {
      const battle = createBattle([
        '|switch|p1a: Jolteon|Jolteon, M|100/100',
        '|switch|p2a: Blissey|Blissey, F|100/100',
        '|turn|1', '|',
        '|switch|p1a: Snorlax|Snorlax, M|100/100 par',

        '|switch|p1a: Snorlax|Snorlax, M|100/100',
        '|-start|p1a: Snorlax|ability: Orichalcum Pulse',

      assertEqual(stats.atk, 341, 'Shared Orichalcum Pulse Atk');

    runTest('Sand Rush in sand should double Spe', () => {
      const battle = createBattle([

    runTest('Slush Rush in snow should double Spe', () => {

    runTest('Solar Power in sun should boost SpA by 1.5', () => {
      const battle = createBattle([
        '|switch|p1a: Charizard|Charizard, M|100/100',
        '|switch|p2a: Torkoal|Torkoal, F|100/100',
        '|-weather|SunnyDay|[from] ability: Drought|[of] p2a: Torkoal',

    runTest('Hadron Engine in Electric Terrain should boost SpA by 4/3', () => {
      const battle = createBattle([
        '|switch|p1a: Miraidon|Miraidon|100/100',
        '|switch|p2a: Pincurchin|Pincurchin, F|100/100',
        '|-fieldstart|move: Electric Terrain|[from] ability: Electric Surge|[of] p2a: Pincurchin',
        '|turn|1', '|',
        '|switch|p1a: Snorlax|Snorlax, M|100/100',

    runTest('Surge Surfer in Electric Terrain should double Spe', () => {

    runTest('Grass Pelt in Grassy Terrain should boost Def by 1.5', () => {
      const battle = createBattle([
        '|switch|p1a: Gogoat|Gogoat, M|100/100',

    // Export results
    window.__TEST_RESULTS__ = results;
    document.getElementById('results').textContent = JSON.stringify(results, null, 2);
  </script>
</body>
</html>
